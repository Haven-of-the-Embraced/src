name: Makefile CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Build MUD
      run: make -C src -j2

    - name: Run Boot & Loop Test
      working-directory: src
      run: ./rom 4055 testrun
